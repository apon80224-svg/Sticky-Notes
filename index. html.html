<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>আমার ডিজিটাল নলেজ হাব</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: #f4f4f9; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 10px; }
        .search-box { width: 100%; padding: 10px; margin-bottom: 20px; }
        .subject-card { padding: 15px; border-bottom: 1px solid #ddd; }
        h1 { color: #333; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>আমার শেখার জগত</h1>
        <input type="text" id="search" class="search-box" placeholder="আপনার প্রয়োজনীয় তথ্য সার্চ করুন...">
        
        <div id="content">
            <div class="subject-card">
                <h3>Accounting</h3>
                <p>এখানে আপনার একাউন্টিং এর প্রয়োজনীয় লেসনগুলো থাকবে।</p>
            </div>
            <!-- আপনি এখানে নতুন নতুন তথ্য আপডেট করবেন -->
        </div>
    </div>

    <script>
        document.getElementById('search').addEventListener('input', function(e) {
            let filter = e.target.value.toLowerCase();
            let items = document.querySelectorAll('.subject-card');
            items.forEach(item => {
                item.style.display = item.innerText.toLowerCase().includes(filter) ? 'block' : 'none';
            });
        });
    </script>
</body>
</html>
